[workspace]
members  = [ "crates/*" ]
resolver = "3"

[workspace.package]
edition      = "2024"
homepage     = "https://github.com/nix-community/nh"
license      = "EUPL-1.2"
rust-version = "1.95.0"
version      = "4.5.0-beta1"

[workspace.dependencies]
nh             = { path = "crates/nh", version = "4.5.0-beta1" }
nh-clean       = { path = "crates/nh-clean", version = "4.5.0-beta1" }
nh-config      = { path = "crates/nh-config", version = "4.5.0-beta1" }
nh-core        = { path = "crates/nh-core", version = "4.5.0-beta1" }
nh-darwin      = { path = "crates/nh-darwin", version = "4.5.0-beta1" }
nh-diff        = { path = "crates/nh-diff", version = "4.5.0-beta1" }
nh-home        = { path = "crates/nh-home", version = "4.5.0-beta1" }
nh-installable = { path = "crates/nh-installable", version = "4.5.0-beta1" }
nh-nixos       = { path = "crates/nh-nixos", version = "4.5.0-beta1" }
nh-remote      = { path = "crates/nh-remote", version = "4.5.0-beta1" }
nh-search      = { path = "crates/nh-search", version = "4.5.0-beta1" }

nix-command     = { path = "crates/nix-command", version = "0.2.4" }
nix-installable = { path = "crates/nix-installable", version = "0.1.0" }

caress            = "0.2.1"
dix               = "2.2.0"
elasticsearch-dsl = "0.4.24"
flub              = "0.1.0"
humantime         = "2.3.0"
indicatif         = "0.18.4"
inquire           = { default-features = false, features = [ "crossterm" ], version = "0.9.1" }
jiff              = { default-features = false, features = [ "std", "tzdb-zoneinfo" ], version = "0.2.35" }
pound             = "0.5.3"
spam-db           = "0.3.0"

nix = { default-features = false, features = [ "fs", "user", "hostname" ], version = "0.31.1" }
proptest = "1.9.0"
regex = "1.12.2"
reqwest = { default-features = false, features = [
  "blocking",
  "json",
  "rustls",
], version = "0.13.1" }
secrecy = { features = [ "serde" ], version = "0.10.3" }
semver = "1.0.27"
serde = { features = [ "derive" ], version = "1.0.228" }
serde_json = "1.0.145"
serial_test = "3.2.0"
shlex = "2.0.1"
subprocess = "1.0.3"
supports-hyperlinks = "3.1.0"
system-configuration = "0.8.0"
tempfile = "3.23.0"
textwrap = { features = [ "terminal_size" ], version = "0.16.2" }
toml_edit = "0.25.12"
tracing = "0.1.41"
tracing-subscriber = { features = [ "env-filter", "registry", "std" ], version = "0.3.20" }
urlencoding = "2.1.3"
walkdir = "2.5.0"
which = "8.0.0"
yansi = "1.0.1"

[workspace.dependencies.misstep]
features = [ "backtrace", "color", "location", "panic-hook", "pretty" ]
version  = "0.4.1"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
nursery    = { level = "warn", priority = -1 }
pedantic   = { level = "warn", priority = -1 }
perf       = { level = "warn", priority = -1 }
style      = { level = "warn", priority = -1 }

# The lint groups above enable some less-than-desirable rules, we should manually
# enable those to keep our sanity.
absolute_paths                 = "allow"
arbitrary_source_item_ordering = "allow"
enum_variant_names             = "allow"
implicit_return                = "allow"
missing_docs_in_private_items  = "allow"
non_ascii_literal              = "allow"
pattern_type_mismatch          = "allow"
print_stdout                   = "allow"
question_mark_used             = "allow"
similar_names                  = "allow"
single_call_fn                 = "allow"
std_instead_of_core            = "allow"
struct_excessive_bools         = "allow"
too_long_first_doc_paragraph   = "allow"
too_many_lines                 = "allow"
unused_trait_names             = "allow"

# In the honor of a recent Cloudflare regression
# Let's get rid of them, what the hell
panic       = "deny"
unwrap_used = "deny"

# Less dangerous, but we'd like to know
expect_used   = "warn"
todo          = "warn"
unimplemented = "warn"
unreachable   = "warn"

[profile.release]
lto       = "thin"
opt-level = 3
strip     = true
